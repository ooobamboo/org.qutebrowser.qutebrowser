name: Build and release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder patch
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Build flatpak
        run: |
          flatpak-builder --user --force-clean --install-deps-from=flathub \
            --disable-rofiles-fuse --state-dir="$RUNNER_TEMP/flatpak-state" \
            flatpak-build org.qutebrowser.qutebrowser.yml
          flatpak build-export flatpak-repo flatpak-build master
          flatpak build-bundle flatpak-repo qutebrowser-${GITHUB_REF_NAME}.flatpak \
            org.qutebrowser.qutebrowser master

      - name: Checksums
        run: |
          sha256sum qutebrowser-${GITHUB_REF_NAME}.flatpak > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: qutebrowser-${GITHUB_REF_NAME}.flatpak
          path: |
            qutebrowser-${GITHUB_REF_NAME}.flatpak
            SHA256SUMS

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: |
            qutebrowser-${GITHUB_REF_NAME}.flatpak
            SHA256SUMS
          body: |
            Qt6 qutebrowser Flatpak for the manual distribution channel.

            Requires the `org.kde.Platform` 6.11 runtime, installed automatically
            from Flathub on first launch.

            Install:
            ```
            flatpak install ./qutebrowser-${GITHUB_REF_NAME}.flatpak
            ```