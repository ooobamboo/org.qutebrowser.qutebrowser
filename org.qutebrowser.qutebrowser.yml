app-id: org.qutebrowser.qutebrowser
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
base: com.riverbankcomputing.PyQt.BaseApp
#base: io.qt.qtwebengine.BaseApp  # pyqt-shared-module
base-version: '6.11'
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
#   - ENABLED_PYQT_BINDINGS=QtCore:QtDBus:QtGui:QtNetwork:QtOpenGL:QtPrintSupport:QtQml:QtQuick:QtSql:QtTest:QtWebChannel:QtWidgets
    - CARGO_VARS= HOME=${FLATPAK_BUILDER_BUILDDIR} CARGO_HOME=${FLATPAK_BUILDER_BUILDDIR}/cargo
      RUSTC_WRAPPER=$(if [ "$CCACHE_DIR" == "/run/ccache" ]; then echo ${SCCACHE_BIN};
      fi;)
    - SCCACHE_BIN=/app/bin/sccache
    - SCCACHE_DIR=/run/ccache/sccache
    - SCCACHE_CONF=/run/ccache/sccache/config
command: /app/bin/qutebrowser
rename-icon: qutebrowser
add-extensions:
  org.qutebrowser.qutebrowser.Userscripts:
    directory: userscripts
    version: stable
    add-ld-path: lib
    no-autodownload: true
finish-args:
  - --device=dri
  - --env=PATH=/app/bin:/app/userscripts/bin:/usr/bin:/app/userscripts/share/perl6/site/bin:/var/data/bin:/var/data/python/bin
  - --env=PYTHONPATH=/app/userscripts/lib/python/site-packages
  - --env=PYTHONUSERBASE=/var/data/python
  - --env=QTWEBENGINEPROCESS_PATH=/app/bin/QtWebEngineProcess
  - --env=QTWEBENGINE_RESOURCES_PATH=/app/resources
  - --env=QTWEBENGINE_LOCALES_PATH=/app/translations/qtwebengine_locales
  - --filesystem=xdg-download
  - --filesystem=xdg-music
  - --filesystem=xdg-pictures
  - --filesystem=xdg-videos
  - --filesystem=xdg-run/pipewire-0:ro
  - --filesystem=/run/.heim_org.h5l.kcm-socket
  - --own-name=org.kde.*
  - --own-name=org.mpris.MediaPlayer2.qutebrowser.*
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --socket=wayland
  - --system-talk-name=org.freedesktop.UPower
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.ScreenSaver
  - --talk-name=org.freedesktop.portal.*
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.StatusNotifierWatcher
cleanup:
  - /include
  - /lib/pkgconfig
  - '*.a'
  - '*.la'
cleanup-commands:
  - /app/cleanup-BaseApp.sh
  # avoid dependency of python modules from extension on module from the app
  - rm -vrf ${FLATPAK_DEST}/lib/python*/site-packages/packaging
  - rm -vrf ${FLATPAK_DEST}/lib/python*/site-packages/packaging-*.dist-info
  - rm -vrf ${FLATPAK_DEST}/lib/python*/site-packages/ply
  - rm -vrf ${FLATPAK_DEST}/lib/python*/site-packages/ply-*.dist-info
  - rm -vrf ${FLATPAK_DEST}/lib/python*/site-packages/pyparsing
  - rm -vrf ${FLATPAK_DEST}/lib/python*/site-packages/pyparsing-*.dist-info
  - rm -vrf ${FLATPAK_DEST}/lib/python*/site-packages/toml
  - rm -vrf ${FLATPAK_DEST}/lib/python*/site-packages/toml-*.dist-info
  - rm -vrf ${FLATPAK_DEST}/lib/python*/site-packages/tomli
  - rm -vrf ${FLATPAK_DEST}/lib/python*/site-packages/tomli-*.dist-info
  - rm -vrf ${FLATPAK_DEST}/lib/python*/site-packages/typing_extensions-*.dist-info
  - rm -vrf ${FLATPAK_DEST}/lib/python*/site-packages/typing_extensions.py

modules:
  - name: qutebrowser
    buildsystem: simple
    build-commands:
      # avoid installing as zip file
      - sed -i '/zip_safe=/ s/True/False/' setup.py
      - python3 scripts/asciidoc2html.py
      - make --file misc/Makefile install PREFIX=${FLATPAK_DEST}
      - install -dm755 ${FLATPAK_DEST}/userscripts
      - sed -i '/^Exec=qutebrowser/ s@=@='${FLATPAK_DEST}'/bin/@' ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
    run-tests: false
    test-commands:
      - |
        export QTWEBENGINEPROCESS_PATH=${FLATPAK_DEST}/bin/QtWebEngineProcess
        export PYTHONPATH=.
        # Flathub CI has XDG_RUNTIME_DIR mode bits set to 0755
        if [ "$(stat --format=%04a $XDG_RUNTIME_DIR)" = "0755" ]; then
          chmod -v 0700 $XDG_RUNTIME_DIR
        fi
        # verbose output:  -v -s --no-qt-log
        # workaround for Flathub CI's inability to detect job failure and stopping it
        pytest --qute-backend=webengine || true
    sources:
      - type: git
        url: https://github.com/qutebrowser/qutebrowser.git
        tag: v3.7.0
        commit: b0a7967f11c1c616d3914f3227113e121efb0fe8
        x-checker-data:
          is-main-source: true
          type: json
          url: https://api.github.com/repos/qutebrowser/qutebrowser/releases/latest
          tag-query: .tag_name
          version-query: $tag
          timestamp-query: .published_at
      - type: patch
        path: qutebrowser-appdata-wiki.patch

    modules:
      - name: sccache-bin
        buildsystem: simple
        build-commands:
          - install -Dm755 sccache -t ${FLATPAK_DEST}/bin/
        sources:
          - type: archive
            only-arches:
              - x86_64
            url: https://github.com/mozilla/sccache/releases/download/v0.18.0/sccache-v0.18.0-x86_64-unknown-linux-musl.tar.gz
            sha256: 45f1447fbe231e3037bde351ef70677dd212216c8d62ae7ca409fecc4d6acc89
            x-checker-data:
              type: anitya
              project-id: 227267
              url-template: https://github.com/mozilla/sccache/releases/download/v$version/sccache-v$version-x86_64-unknown-linux-musl.tar.gz
          - type: archive
            only-arches:
              - aarch64
            url: https://github.com/mozilla/sccache/releases/download/v0.18.0/sccache-v0.18.0-aarch64-unknown-linux-musl.tar.gz
            sha256: 2b3284d5da3b46a47dc4229e75bb7b88ac4aa99c8d754fb7d2f84997e5a4354a
            x-checker-data:
              type: anitya
              project-id: 227267
              url-template: https://github.com/mozilla/sccache/releases/download/v$version/sccache-v$version-aarch64-unknown-linux-musl.tar.gz
        cleanup:
          - '*'

     #- pyqt-shared-module.json

      - name: asciidoc
        buildsystem: simple
        build-commands:
          - python setup.py build
          - python setup.py install --prefix=${FLATPAK_DEST} --root=/ --optimize=1
          - install -Dm644 asciidoc/resources/docbook-xsl/*.xsl -t ${FLATPAK_DEST}/lib/python/site-packages/asciidoc/resources/docbook-xsl/
        sources:
          - type: archive
            url: https://github.com/asciidoc-py/asciidoc-py/archive/10.2.1/asciidoc-10.2.1.tar.gz
            sha256: 8e1fb9691952cc4f13357e1ef58172e566c5f88e3c44222d4a8693585f884507
            x-checker-data:
              type: html
              url: https://asciidoc-py.github.io/
              version-pattern: AsciiDoc ([\d\.-]+) Released
              url-template: https://github.com/asciidoc-py/asciidoc-py/archive/$version/asciidoc-$version.tar.gz
        cleanup:
          - '*'

      - name: python-jinja
        buildsystem: simple
        build-commands:
          - pip3 install --verbose --exists-action=i --no-index --find-links=file://${PWD}
            --prefix=${FLATPAK_DEST} Jinja2 --no-build-isolation
        sources:
          - type: file
            url: https://files.pythonhosted.org/packages/62/a1/3d680cbfd5f4b8f15abc1d571870c5fc3e594bb582bc3b64ea099db13e56/jinja2-3.1.6-py3-none-any.whl
            sha256: 85ece4451f492d0c13c5dd7c13a64681a86afae63a5f347908daf103ce6d2f67
            x-checker-data:
              type: pypi
              name: Jinja2
              packagetype: bdist_wheel
              # the sdist consistently returns 404 from files.pythonhosted.org on
              # some networks (CDN issue), so use the pure-python wheel instead
        modules:
          - name: python-markupsafe
            buildsystem: simple
            build-commands:
              - pip3 install --verbose --exists-action=i --no-index --find-links=file://${PWD}
                --prefix=${FLATPAK_DEST} MarkupSafe --no-build-isolation
            sources:
              - type: file
                only-arches:
                  - x86_64
                url: https://files.pythonhosted.org/packages/a9/21/9b05698b46f218fc0e118e1f8168395c65c8a2c750ae2bab54fc4bd4e0e8/markupsafe-3.0.3-cp313-cp313-manylinux2014_x86_64.manylinux_2_17_x86_64.manylinux_2_28_x86_64.whl
                sha256: ccfcd093f13f0f0b7fdd0f198b90053bf7b2f02a3927a30e63f3ccc9df56b676
                x-checker-data:
                  type: pypi
                  name: MarkupSafe
                  packagetype: bdist_wheel
                  # the sdist consistently returns 404 on files.pythonhosted.org (CDN
                  # issue), so use the prebuilt wheel instead
              - type: file
                only-arches:
                  - aarch64
                url: https://files.pythonhosted.org/packages/00/07/575a68c754943058c78f30db02ee03a64b3c638586fba6a6dd56830b30a3/markupsafe-3.0.3-cp313-cp313-manylinux2014_aarch64.manylinux_2_17_aarch64.manylinux_2_28_aarch64.whl
                sha256: 133a43e73a802c5562be9bbcd03d090aa5a1fe899db609c29e8c8d815c5f6de6
                x-checker-data:
                  type: pypi
                  name: MarkupSafe
                  packagetype: bdist_wheel

      - name: python-pygments
        # available in the sdk but not in the runtime
        # required by format_json userscript, and optional for viewing source with ':view-source --pygments',
        buildsystem: simple
        build-commands:
          - pip3 install --ignore-installed --exists-action=i --no-index --find-links=file://$PWD
            --prefix=$FLATPAK_DEST Pygments --no-build-isolation
        sources:
          - type: file
            url: https://files.pythonhosted.org/packages/f4/7e/a72dd26f3b0f4f2bf1dd8923c85f7ceb43172af56d63c7383eb62b332364/pygments-2.20.0-py3-none-any.whl
            sha256: 81a9e26dd42fd28a23a2d169d86d7ac03b46e2f8b59ed4698fb4785f946d0176
            x-checker-data:
              type: pypi
              name: Pygments
              packagetype: bdist_wheel
              # upstream switched to the hatchling build backend, so use the wheel to avoid needing it during building

      - name: python-pyyaml
        buildsystem: simple
        build-commands:
          - pip3 install --verbose --exists-action=i --no-index --find-links=file://${PWD}
            --prefix=${FLATPAK_DEST} PyYAML --no-build-isolation
        sources:
          - type: file
            only-arches:
              - x86_64
            url: https://files.pythonhosted.org/packages/74/27/e5b8f34d02d9995b80abcef563ea1f8b56d20134d8f4e5e81733b1feceb2/pyyaml-6.0.3-cp313-cp313-manylinux2014_x86_64.manylinux_2_17_x86_64.manylinux_2_28_x86_64.whl
            sha256: 0f29edc409a6392443abf94b9cf89ce99889a1dd5376d94316ae5145dfedd5d6
            x-checker-data:
              type: pypi
              name: PyYAML
              packagetype: bdist_wheel
              # the sdist 404s from files.pythonhosted.org (CDN issue), use the
              # wheel instead; it also ships a statically linked libyaml, so the
              # separate libyaml build is no longer needed
          - type: file
            only-arches:
              - aarch64
            url: https://files.pythonhosted.org/packages/50/31/b20f376d3f810b9b2371e72ef5adb33879b25edb7a6d072cb7ca0c486398/pyyaml-6.0.3-cp313-cp313-manylinux2014_aarch64.manylinux_2_17_aarch64.manylinux_2_28_aarch64.whl
            sha256: ee2922902c45ae8ccada2c5b501ab86c36525b883eff4255313a253a3160861c
            x-checker-data:
              type: pypi
              name: PyYAML
              packagetype: bdist_wheel

      - name: maturin-bin
        buildsystem: simple
        build-commands:
          - pip3 install --verbose --exists-action=i --no-index --find-links=file://${PWD}
            --prefix=${FLATPAK_DEST} maturin --no-build-isolation
        sources:
          - type: file
            only-arches:
              - x86_64
            url: https://files.pythonhosted.org/packages/fe/91/b495e19e2f5c503b540452b2039115e7b2363867e8c5ad4179eb752fa92c/maturin-1.15.0-py3-none-manylinux_2_12_x86_64.manylinux2010_x86_64.musllinux_1_1_x86_64.whl
            sha256: 653020a63525bb224e5ab0adf02e17a2e08bc86dbea7fc1399c9a56d7529b99e
            x-checker-data:
              type: anitya
              project-id: 42653
              url-template: https://files.pythonhosted.org/packages/py3/m/maturin/maturin-$version-py3-none-manylinux_2_12_x86_64.manylinux2010_x86_64.musllinux_1_1_x86_64.whl
          - type: file
            only-arches:
              - aarch64
            url: https://files.pythonhosted.org/packages/5d/2b/2abff58037188d852b124871b1f0d720e1c2bfb3d4f1b03d87c52cd66488/maturin-1.15.0-py3-none-manylinux_2_17_aarch64.manylinux2014_aarch64.musllinux_1_1_aarch64.whl
            sha256: 0ebf9767892725083138e671c34482c660317a2f3d6a29fc0e0f34e9d8c99136
            x-checker-data:
              type: anitya
              project-id: 42653
              url-template: https://files.pythonhosted.org/packages/py3/m/maturin/maturin-$version-py3-none-manylinux_2_17_aarch64.manylinux2014_aarch64.musllinux_1_1_aarch64.whl
        cleanup:
          - '*'

      - python-adblock/python-adblock.json

      - name: pdfjs
        buildsystem: simple
        build-commands:
          - unzip pdfjs-*.zip
          - install -dm755 ${FLATPAK_DEST}/share/pdf.js
          - cp -R {LICENSE,build,web} ${FLATPAK_DEST}/share/pdf.js
          - find ${FLATPAK_DEST}/share/pdf.js -type f -exec chmod 644 {} \;
        sources:
          - type: file
            url: https://github.com/mozilla/pdf.js/releases/download/v4.10.38/pdfjs-4.10.38-legacy-dist.zip
            sha256: c85b52b94e081c0443333da0ba4270661b2061da573133984c6272fe3e27bb57
#           x-checker-data:
#             is-important: true
#             type: json
#             url: https://api.github.com/repos/mozilla/pdf.js/releases
#             version-query: .[0] | .tag_name | sub("^v"; "")
#             url-query: .[0] | .assets[] | select(.name=="pdfjs-" + $version + "-legacy-dist.zip")
#               | .browser_download_url

      - flatpak-spawn-wrapper/flatpak-spawn-wrapper.json

      # TODO: f-e-d-c for tests
      #- tests/tests-dependencies.json
